<svg viewBox="0 0 320 360" xmlns="http://www.w3.org/2000/svg">
  <ellipse cx="160" cy="350" rx="100" ry="10" fill="#3A2417" opacity="0.08"/>

  <!-- club leaning -->
  <g transform="rotate(18 60 300)">
    <rect x="52" y="230" width="14" height="90" rx="6" fill="#6B4226"/>
    <ellipse cx="59" cy="222" rx="20" ry="16" fill="#6B4226"/>
    <circle cx="50" cy="216" r="3.5" fill="#4A2C18"/>
    <circle cx="66" cy="228" r="3" fill="#4A2C18"/>
    <circle cx="58" cy="232" r="3" fill="#4A2C18"/>
  </g>

  <!-- body: fur tunic, one shoulder -->
  <path d="M96 360V266c0-34 20-58 52-64h44c32 6 52 30 52 64v94z" fill="#E7D2A6"/>
  <g fill="#8A5A34" opacity="0.9">
    <ellipse cx="130" cy="300" rx="8" ry="6"/>
    <ellipse cx="176" cy="330" rx="7" ry="5"/>
    <ellipse cx="200" cy="290" rx="6" ry="5"/>
    <ellipse cx="150" cy="270" rx="6" ry="4.6"/>
  </g>
  <path d="M150 202c-10 6-14 16-10 28l30 8 6-30z" fill="#D9A06B"/>

  <!-- neck -->
  <rect x="146" y="184" width="30" height="30" rx="10" fill="#D9A06B"/>

  <!-- resting arm holding nothing, relaxed -->
  <path d="M108 250c-22 0-40-12-50-32l-15 7c10 26 30 42 58 46z" fill="#D9A06B"/>

  <!-- other arm: scratching head -->
  <path d="M206 240c14-14 18-32 12-52l16-4c8 24 2 48-14 64z" fill="#E7D2A6"/>
  <g transform="translate(224,146) rotate(20)">
    <circle r="13" fill="#D9A06B"/>
    <path d="M-4 -2l3 -10M2 -4l3 -10M8 -3l3 -9" stroke="#D9A06B" stroke-width="6" stroke-linecap="round"/>
  </g>

  <!-- head -->
  <circle cx="160" cy="132" r="58" fill="#D9A06B"/>
  <circle cx="104" cy="134" r="8" fill="#D9A06B"/>
  <circle cx="216" cy="134" r="8" fill="#D9A06B"/>

  <!-- wild hair -->
  <path d="M100 118c-6-30 16-58 60-58s66 28 60 58c-8-14-16-8-22-20-6 10-16 4-22-4-6 12-18 6-24-2-4 12-16 8-22 0-6 10-8 18-30 26z" fill="#4A2C18"/>
  <path d="M92 130c-8 4-10 14-4 22" stroke="#4A2C18" stroke-width="10" fill="none" stroke-linecap="round"/>
  <path d="M228 130c8 4 10 14 4 22" stroke="#4A2C18" stroke-width="10" fill="none" stroke-linecap="round"/>

  <!-- beard -->
  <path d="M122 158c4 26 16 44 38 44s34-18 38-44c-16 10-60 10-76 0z" fill="#5C3A26"/>

  <!-- confused unibrow -->
  <path d="M120 116c14-10 30-10 40-2 10-8 26-8 40 2" stroke="#2B1B12" stroke-width="5" fill="none" stroke-linecap="round"/>

  <!-- eyes: one squint one wide -->
  <ellipse cx="136" cy="132" rx="5" ry="6" fill="#2B1B12"/>
  <path d="M188 130c4-3 10-3 14 0" stroke="#2B1B12" stroke-width="4" fill="none" stroke-linecap="round"/>

  <!-- flat confused mouth -->
  <path d="M144 172q16 6 32 0" stroke="#2B1B12" stroke-width="4" fill="none" stroke-linecap="round"/>

  <!-- question mark -->
  <text x="248" y="90" font-family="Georgia, serif" font-size="46" fill="#C05A2C" font-weight="700">?</text>
</svg>

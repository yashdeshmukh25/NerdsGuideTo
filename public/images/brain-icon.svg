<svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <!-- radiating spark lines: brain "lighting up" -->
  <g stroke="#E7A93F" stroke-width="2.6" stroke-linecap="round">
    <line x1="14" y1="9" x2="10" y2="4"/>
    <line x1="32" y1="5" x2="32" y2="0"/>
    <line x1="50" y1="9" x2="54" y2="4"/>
  </g>

  <!-- brain outline (scalloped blob, bumpy top / rounded bottom) -->
  <path
    d="M16,46
       C10,46 8,40 10,34
       C6,32 6,26 10,22
       C8,16 14,12 20,14
       C22,8 30,7 32,12
       C36,7 44,8 46,14
       C52,12 58,16 56,22
       C60,26 60,32 56,34
       C58,40 56,46 50,46
       C50,50 44,53 38,51
       C34,54 28,54 24,51
       C20,53 16,50 16,46 Z"
    fill="none" stroke="#3A2417" stroke-width="3" stroke-linejoin="round"/>

  <!-- central hemisphere divider -->
  <path d="M32,14 C29,20 35,26 32,32 C29,38 35,42 32,48"
    fill="none" stroke="#3A2417" stroke-width="2.4" stroke-linecap="round"/>

  <!-- wrinkle details -->
  <path d="M17,26 C20,24 23,25 24,28" fill="none" stroke="#3A2417" stroke-width="1.8" stroke-linecap="round"/>
  <path d="M17,36 C20,35 23,36 25,39" fill="none" stroke="#3A2417" stroke-width="1.8" stroke-linecap="round"/>
  <path d="M47,26 C44,24 41,25 40,28" fill="none" stroke="#3A2417" stroke-width="1.8" stroke-linecap="round"/>
  <path d="M47,36 C44,35 41,36 39,39" fill="none" stroke="#3A2417" stroke-width="1.8" stroke-linecap="round"/>

  <!-- lightning bolt: the "spark" -->
  <path d="M35,15 L24,35 L30,35 L27,49 L42,27 L34,27 Z" fill="#E7A93F" stroke="#3A2417" stroke-width="1.6" stroke-linejoin="round"/>
</svg>
